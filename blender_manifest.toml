schema_version = "1.0.0"

id = "bh_heli_rig"
version = "1.3.1"
name = "Black Hawk Rig"
tagline = "Pilote le rig du UH-60 : rotors, pales, vol, portes et LEDs"
maintainer = "Lucas Burdier"
type = "add-on"
website = "https://github.com/lburdier/bh-heli-rig"
tags = ["Animation", "Rigging"]
blender_version_min = "4.2.0"
license = ["SPDX:GPL-3.0-or-later"]

[permissions]
network = "Modèle 3D du UH-60 et mises à jour de l'add-on (GitHub)"
files = "Installer le modèle téléchargé dans le dossier de l'extension"

[build]
paths_exclude_pattern = [
  "__pycache__/",
  "/.git/",
  "/.github/",
  "/.gitignore",
  "/outils/",
  "*.zip",
  "*.pyc",
]
